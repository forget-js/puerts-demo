name: Check

on:
    workflow_dispatch:

jobs:
    scripts:
        name: TypeScript checks and release script build
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check TypeScript project
              run: npm run check

            - name: Build Shipping JavaScript
              run: npm run build:shipping
